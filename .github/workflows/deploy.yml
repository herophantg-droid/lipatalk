name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Get fresh Railway token
        id: rail
        run: |
          TOKEN=$(curl -sS -X POST https://backboard.railway.app/oauth/token \
            -d grant_type=refresh_token \
            -d refresh_token="${{ secrets.RAILWAY_REFRESH_TOKEN }}" \
            -d client_id=rlwy_oaci_onEklvmksh1hRUiCo7E2zX12 | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ steps.rail.outputs.token }}
        run: railway up --detach --yes --project 47912486-69fc-4bc1-a4ba-1d239e8de551 --service b5b020bc-7153-45db-a064-28c918dada1b --environment 0026202b-a334-4b33-b5c2-84bb065219d8
